<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suivi Examinateurs FL</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f4f4;
padding:20px;
}

.card{
background:white;
padding:20px;
margin-bottom:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.1);
}

input,select{
width:100%;
padding:10px;
margin:5px 0;
box-sizing:border-box;
}

button{
padding:10px 20px;
background:#0078d4;
color:white;
border:none;
cursor:pointer;
}

button:hover{
background:#005ea1;
}
</style>
</head>

<body>

<h1>Suivi Examinateurs FL</h1>

<div class="card">
<h2>Ajouter un examinateur</h2>
<input id="agentNom" placeholder="Nom de l'agent">
<button onclick="ajouterAgent()">Ajouter</button>
</div>

<div class="card">
<h2>Enregistrer un examen</h2>
<select id="examinateur"></select>
<input id="candidat" placeholder="Nom du candidat">
<button onclick="ajouterExamen()">Enregistrer</button>
</div>

<div class="card">
<h2>Statistiques</h2>
<div id="stats"></div>
</div>

<div class="card">
<h2>Suggestions automatiques</h2>
<div id="suggestions"></div>
</div>

<div class="card">
<h2>Examinateurs</h2>

<table id="tableAgents" style="width:100%; border-collapse:collapse;">
<thead>
<tr>
<th style="text-align:left;">Nom</th>
<th style="text-align:left;">Examens</th>
<th style="text-align:left;">Dernier examen</th>
<th style="text-align:left;">Statut</th>
<th style="text-align:left;">Action</th>
</tr>
</thead>

<tbody id="agents">
</tbody>

</table>
</div>

<div class="card">
<h2>Historique des examens</h2>
<div id="historique"></div>
</div>

<div class="card">
<h2>Examinateurs inactifs</h2>
<div id="inactifs"></div>
</div>

<div class="card">
<h2>⚠️ Examinateurs à surveiller</h2>
<div id="surveillance"></div>
</div>

<script>

let agents =
JSON.parse(localStorage.getItem("agents")) || [];

let examens =
JSON.parse(localStorage.getItem("examens")) || [];

function sauvegarder() {
    localStorage.setItem("agents", JSON.stringify(agents));
    localStorage.setItem("examens", JSON.stringify(examens));
    afficher();
}

function ajouterAgent() {

    const nom =
    document.getElementById("agentNom").value.trim();

    if(!nom) return;

    agents.push({
        nom: nom,
        examens: 0,
        dernierExamen: null
    });

    document.getElementById("agentNom").value = "";

    sauvegarder();
}

function ajouterExamen() {

    const nom =
    document.getElementById("examinateur").value;

    const candidat =
    document.getElementById("candidat").value;

    const agent =
    agents.find(a => a.nom === nom);

    if(!agent) return;

    agent.examens++;
    
    agent.dernierExamen =
    new Date().toLocaleDateString();
    ``

    examens.push({
        date: new Date().toLocaleDateString(),
        examinateur: nom,
        candidat: candidat
    });

    document.getElementById("candidat").value = "";

    sauvegarder();
}

function afficher() {
    const liste = document.getElementById("agents");
    const select = document.getElementById("examinateur");

    liste.innerHTML = "";
    select.innerHTML = "";

    agents.forEach(a => {

let statut = "🟢 Actif";

if(a.examens === 0){
    statut = "🔴 Inactif";
}

liste.innerHTML += `
<tr>
    <td>${a.nom}</td>
    <td>${a.examens}</td>
    <td>${a.dernierExamen || "Jamais"}</td>
    <td>${statut}</td>
    <td>
        <button onclick="supprimerAgent('${a.nom}')">
            Supprimer
        </button>
    </td>
</tr>
`;

        select.innerHTML += `
            <option>${a.nom}</option>
        `;
    });

    const agentsASurveiller = agents.filter(a => {

        if (!a.dernierExamen) {
            return true;
        }

        const aujourdHui = new Date();

        const dernier = new Date(
            a.dernierExamen.split("/").reverse().join("-")
        );

        const difference = Math.floor(
            (aujourdHui - dernier) /
            (1000 * 60 * 60 * 24)
        );

        return difference > 15;

    });

    const surveillance = document.getElementById("surveillance");

    if (surveillance) {
        surveillance.innerHTML = "";

        agentsASurveiller.forEach(a => {
            surveillance.innerHTML += `
                <p>
                    ⚠️ <b>${a.nom}</b>
                    (${a.dernierExamen || "Aucun examen"})
                </p>
            `;
        });
    }

    document.getElementById("stats").innerHTML =
    `
    Total examinateurs : ${agents.length}<br>
    Total examens : ${agents.reduce((t,a)=>t+a.examens,0)}
    `;

const recommandations =
[...agents]
.sort((a,b)=>{

if(!a.dernierExamen) return -1;
if(!b.dernierExamen) return 1;

const dateA =
new Date(
a.dernierExamen.split("/").reverse().join("-")
);

const dateB =
new Date(
b.dernierExamen.split("/").reverse().join("-")
);

return dateA - dateB;

})
.slice(0,3);

document.getElementById("suggestions").innerHTML =
recommandations
.map((a,i)=>`

<p>
<b>🥇 #${i+1} - ${a.nom}</b><br>
Examens : ${a.examens}<br>
Dernier examen :
${a.dernierExamen || "Jamais"}
</p>

`)
.join("");

    document.getElementById("historique").innerHTML =
    examens
    .slice()
    .reverse()
    .map(e =>
        `<p>${e.date} - ${e.examinateur} → ${e.candidat}</p>`
    )
    .join("");
    const inactifs =
agents.filter(a => a.examens === 0);

document.getElementById("inactifs").innerHTML =
inactifs.length
? inactifs.map(a =>
`<p>🔴 ${a.nom}</p>`
).join("")
: "<p>✅ Aucun examinateur inactif</p>";
}

function supprimerAgent(nom){

if(!confirm("Supprimer " + nom + " ?"))
return;

agents =
agents.filter(a => a.nom !== nom);

sauvegarder();
}

afficher();

</script>

</body>
</html>
