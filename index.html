<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suivi Examinateurs FL</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f4f4;
padding:20px;
}

.card{
background:white;
padding:20px;
margin-bottom:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.1);
}

input,select{
width:100%;
padding:10px;
margin:5px 0;
box-sizing:border-box;
}

button{
padding:10px 20px;
background:#0078d4;
color:white;
border:none;
cursor:pointer;
}

button:hover{
background:#005ea1;
}
</style>
</head>

<body>

<h1>Suivi Examinateurs FL</h1>

<div class="card">
<h2>Ajouter un examinateur</h2>
<input id="agentNom" placeholder="Nom de l'agent">
<button onclick="ajouterAgent()">Ajouter</button>
</div>

<div class="card">
<h2>Enregistrer un examen</h2>
<select id="examinateur"></select>
<input id="candidat" placeholder="Nom du candidat">
<button onclick="ajouterExamen()">Enregistrer</button>
</div>

<div class="card">
<h2>Statistiques</h2>
<div id="stats"></div>
</div>

<div class="card">
<h2>Suggestions automatiques</h2>
<div id="suggestions"></div>
</div>

<div class="card">
<h2>Examinateurs</h2>
<div id="agents"></div>
</div>

<div class="card">
<h2>Historique des examens</h2>
<div id="historique"></div>
</div>

<div class="card">
<h2>Examinateurs inactifs</h2>
<div id="inactifs"></div>
</div>

<script>

let agents =
JSON.parse(localStorage.getItem("agents")) || [];

let examens =
JSON.parse(localStorage.getItem("examens")) || [];

function sauvegarder() {
    localStorage.setItem("agents", JSON.stringify(agents));
    localStorage.setItem("examens", JSON.stringify(examens));
    afficher();
}

function ajouterAgent() {

    const nom =
    document.getElementById("agentNom").value.trim();

    if(!nom) return;

    agents.push({
        nom: nom,
        examens: 0
    });

    document.getElementById("agentNom").value = "";

    sauvegarder();
}

function ajouterExamen() {

    const nom =
    document.getElementById("examinateur").value;

    const candidat =
    document.getElementById("candidat").value;

    const agent =
    agents.find(a => a.nom === nom);

    if(!agent) return;

    agent.examens++;

    examens.push({
        date: new Date().toLocaleDateString(),
        examinateur: nom,
        candidat: candidat
    });

    document.getElementById("candidat").value = "";

    sauvegarder();
}

function afficher() {

    const liste =
    document.getElementById("agents");

    const select =
    document.getElementById("examinateur");

    liste.innerHTML = "";
    select.innerHTML = "";

    agents.forEach(a => {

        liste.innerHTML +=
        `<p>${a.nom} : ${a.examens} examen(s)</p>`;

        select.innerHTML +=
        `<option>${a.nom}</option>`;
    });

    document.getElementById("stats").innerHTML =
    `
    Total examinateurs : ${agents.length}<br>
    Total examens : ${agents.reduce((t,a)=>t+a.examens,0)}
    `;

    const recommandations =
    [...agents]
    .sort((a,b)=>a.examens-b.examens)
    .slice(0,3);

    document.getElementById("suggestions").innerHTML =
    recommandations
    .map((a,i)=>
        `<p>#${i+1} ${a.nom} (${a.examens})</p>`
    )
    .join("");

    document.getElementById("historique").innerHTML =
    examens
    .slice()
    .reverse()
    .map(e =>
        `<p>${e.date} - ${e.examinateur} → ${e.candidat}</p>`
    )
    .join("");
    const inactifs =
agents.filter(a => a.examens === 0);

document.getElementById("inactifs").innerHTML =
inactifs.length
? inactifs.map(a =>
`<p>🔴 ${a.nom}</p>`
).join("")
: "<p>✅ Aucun examinateur inactif</p>";
}

afficher();

</script>

</body>
</html>
